<style>
/* Layout: cad-apa-skal – toppbalk, verktygsrad (organisatör) till vänster, arbetsyta, egenskapspanel till höger, statusrad. */
:root{
  --paper:#f3f5f6; --chrome:#fbfcfc; --ink:#1d2328; --muted:#5d666e; --rule:#dce1e4; --faint:#e9edef;
  --accent:#a86b12; --accent-ink:#8a5608; --accent-soft:#f4e7d1;
  --ok:#3f7d4e; --warn:#c2631e; --warn-ink:#a3480f; --warn-soft:#fbeee3; --alarm:#b3261e; --alarm-ink:#9c1f18; --alarm-soft:#fbe9e7; --due:#b4574f; --due-ink:#9a4740; --due-soft:#f7edeb; --sig:#47699a;
  --p0:#3d6fb6; --p1:#2f8a6a; --p2:#8a5cc2; --p3:#c0573c; --p4:#2a8b9c; --p5:#b8487a; --p6:#6f7f2e; --p7:#a7741a; --pint:#7d878e; --pabs:#5f7d8c;
  --scroll:#cdd4d8; --scroll-h:#aeb7bd; --q-base:color-mix(in srgb,#a86b12 30%,#dce1e4); --q-pulse:#c28a3a; --q-hi:#e2bf86;
  --shadow:0 14px 36px rgb(20 28 34 / .16);
  --font-ui:"Archivo",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-data:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --bar-h:52px; --status-h:30px; --rail-w:76px; --panel-w:330px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#161a1d; --chrome:#1d2226; --ink:#e3e7ea; --muted:#99a2aa; --rule:#2c3338; --faint:#232a2e;
  --accent:#e3a94a; --accent-ink:#e8b562; --accent-soft:#3a2f1c;
  --ok:#6fb27f; --warn:#e08a4e; --warn-ink:#f0a675; --warn-soft:#3a2618; --alarm:#e0675c; --alarm-ink:#f29a90; --alarm-soft:#3a1c19; --due:#cf8279; --due-ink:#e4a8a0; --due-soft:#33221f; --sig:#86a6d4;
  --p0:#7fa6e6; --p1:#63c19d; --p2:#b08ee6; --p3:#ec8e72; --p4:#5fc1d1; --p5:#e57fab; --p6:#a9bb5c; --p7:#e0ae4a; --pint:#8e979f; --pabs:#8fb0bf;
  --scroll:#3a4248; --scroll-h:#4c565d; --q-base:color-mix(in srgb,#e3a94a 18%,#2c3338); --q-pulse:#8a6a33; --q-hi:#a8814a;
  --shadow:0 14px 36px rgb(0 0 0 / .45); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#161a1d; --chrome:#1d2226; --ink:#e3e7ea; --muted:#99a2aa; --rule:#2c3338; --faint:#232a2e;
  --accent:#e3a94a; --accent-ink:#e8b562; --accent-soft:#3a2f1c;
  --ok:#6fb27f; --warn:#e08a4e; --warn-ink:#f0a675; --warn-soft:#3a2618; --alarm:#e0675c; --alarm-ink:#f29a90; --alarm-soft:#3a1c19; --due:#cf8279; --due-ink:#e4a8a0; --due-soft:#33221f; --sig:#86a6d4;
  --p0:#7fa6e6; --p1:#63c19d; --p2:#b08ee6; --p3:#ec8e72; --p4:#5fc1d1; --p5:#e57fab; --p6:#a9bb5c; --p7:#e0ae4a; --pint:#8e979f; --pabs:#8fb0bf;
  --scroll:#3a4248; --scroll-h:#4c565d; --q-base:color-mix(in srgb,#e3a94a 18%,#2c3338); --q-pulse:#8a6a33; --q-hi:#a8814a;
  --shadow:0 14px 36px rgb(0 0 0 / .45); color-scheme:dark}

[hidden]{display:none!important}
html,body{height:100%;margin:0;padding:0}
body{padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);box-sizing:border-box;background:var(--paper);color:var(--ink);font:14px/1.4 var(--font-ui);overflow:hidden}
*{box-sizing:border-box}
/* Diskreta rullningslister som följer temat */
*{scrollbar-width:thin;scrollbar-color:var(--scroll) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:10px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background-color:var(--scroll-h)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.mono{font-family:var(--font-data);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{height:100%;display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr) var(--panel-w);grid-template-rows:var(--bar-h) minmax(0,1fr) var(--status-h);grid-template-areas:"top top top" "rail main panel" "status status status"}

/* Toppbalk */
.topbar{grid-area:top;display:flex;align-items:center;gap:10px;min-width:0;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));background:var(--chrome);border-bottom:1px solid var(--rule)}
.brand-btn{height:36px;display:inline-flex;align-items:center;gap:8px;padding:0 8px 0 6px;border:1px solid var(--rule);border-radius:9px;background:var(--paper);font-weight:680;font-size:15px;letter-spacing:-.01em}
.brand-btn:hover,.brand-btn[aria-expanded="true"]{border-color:var(--muted)}
.brand-btn[aria-expanded="true"]{background:var(--accent-soft)}
.logo{width:24px;height:24px}
.logo .slope{stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;fill:none}
.logo .stone{fill:var(--accent)}
.bookname{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bookname strong{color:var(--ink);font-weight:560}
.badge{font-size:10.5px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink);border:1px solid currentColor;border-radius:4px;padding:1px 5px 0}
.spacer{flex:1}
.beta-btn{cursor:pointer;display:inline-flex;flex-direction:column;align-items:flex-start;gap:0;padding:3px 8px;line-height:1.05;background:transparent;font-family:var(--font-ui);border-radius:6px}
.beta-btn b{font-size:10.5px;font-weight:700;letter-spacing:.1em;white-space:nowrap}
.beta-btn .v-num{font-family:var(--font-data);font-weight:500;letter-spacing:0;opacity:.8}
.beta-btn small{font-size:9.5px;font-weight:500;letter-spacing:.02em;text-transform:none;opacity:.85}
.beta-btn:hover{background:var(--accent-soft)}
.about-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.about-head .logo{width:40px;height:40px}
.about-head h2{margin:0}
.about-head .ver{font:12px var(--font-data);color:var(--muted)}
.about ul{margin:0 0 4px;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:13px}
.fb-kind{display:flex;flex-wrap:wrap;gap:6px}
.fb-kind label{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--rule);border-radius:999px;background:var(--paper);font-size:12.5px;font-weight:560;color:var(--ink);cursor:pointer}
.fb-kind input{position:absolute;opacity:0;pointer-events:none}
.fb-kind label:has(input:checked){background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.fb-kind label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:1px}
.fb-to{font-size:12.5px;color:var(--muted)}
.fb-to b{color:var(--ink);font-weight:560}
.fld .opt-lbl{font-weight:400;opacity:.85}
.hp{position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden}
.fb-alt{display:flex;flex-direction:column;gap:8px;padding:10px 12px;border-radius:10px;background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);font-size:12.5px}
.fb-alt .acts{display:flex;flex-wrap:wrap;gap:6px}
.about h3{margin:14px 0 6px;font-size:10.5px;font-weight:650;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.about li b{font-weight:600}
.dlg.wide{width:min(660px,calc(100vw - 24px))}
.qx{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;margin:0 0 4px;font-size:12.5px}
.qx code{justify-self:start;font:500 12.5px var(--font-data);color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:2px 7px;white-space:nowrap}
.qx span{color:var(--muted);align-self:center}
.ab-list{display:flex;flex-direction:column;gap:1px;margin:4px 0 0;padding:0;list-style:none}
.ab-row{--pc:var(--p0);display:grid;grid-template-columns:minmax(0,1fr) 150px;align-items:center;gap:10px;padding:2px 6px;border-radius:9px}
.ab-row:hover{background:var(--paper)}
.ab-row.task{padding-left:30px}
.al-list .ab-row{grid-template-columns:150px minmax(0,1fr)}
.ab-name{display:flex;align-items:center;gap:8px;min-width:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ab-name b{font-weight:620}
.ab-row.task .ab-name{color:var(--muted)}

/* Smartshell (förut smartanteckningen): står alltid överst. Ramen har två mjuka pulser som löper runt (stilla vid reducerad rörelse). */
@property --qa{syntax:'<angle>';inherits:false;initial-value:0deg}
.quick{display:flex;flex-direction:column;gap:2px;padding:8px 12px 8px;border:2px solid transparent;border-radius:14px;
  background:linear-gradient(var(--chrome),var(--chrome)) padding-box,conic-gradient(from var(--qa),var(--q-base) 0deg 80deg,var(--q-pulse) 112deg,var(--q-hi) 120deg,var(--q-base) 145deg 260deg,var(--q-pulse) 292deg,var(--q-hi) 300deg,var(--q-base) 325deg) border-box;
  animation:qpulse 9s linear infinite}
@keyframes qpulse{to{--qa:360deg}}
.quick:focus-within{animation-duration:5.5s;box-shadow:0 0 0 4px var(--accent-soft)}
.quick-top{display:flex;align-items:center;gap:6px;color:var(--accent-ink)}
.quick-top .ic{width:15px;height:15px}

.quick-hint b{color:var(--ink);font-weight:600}
.quick-hint.bad{color:var(--warn-ink)}
/* Smartshell: överst på alla sidor, fäst när man rullar (på dator) */
.sh-dock{max-width:1240px;margin:0 auto 12px;position:sticky;top:-12px;z-index:6;padding-top:12px;margin-top:-12px;background:linear-gradient(var(--paper) 80%,transparent)}

.ccard .sumrow{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12.5px;color:var(--muted)}
.ccard .sumrow b{font:500 13px var(--font-data);color:var(--ink)}

.cell{position:relative;height:38px;border-radius:10px;border:1px dashed var(--rule);background:linear-gradient(to top,color-mix(in srgb,var(--pc) 26%,transparent) calc(var(--f,0) * 100%),transparent calc(var(--f,0) * 100%));transition:border-color .12s;cursor:text}
.cell.has{border:1px solid color-mix(in srgb,var(--pc) 42%,var(--rule))}
.cell.today{border-color:color-mix(in srgb,var(--accent) 45%,var(--rule))}
.cell.colsel{background-color:color-mix(in srgb,var(--accent) 7%,transparent)}
.cell.sel{box-shadow:0 0 0 2px var(--pc)}
.cell:focus-within{border-color:transparent;box-shadow:0 0 0 2px var(--pc)}
.cell .h-in{width:100%;height:100%;border:0;background:transparent;text-align:center;font:500 15px var(--font-data);font-variant-numeric:tabular-nums;border-radius:10px;outline:none;padding:0 4px;cursor:text}
.cell .h-in::placeholder{color:transparent}
.cell:hover .h-in::placeholder,.cell:focus-within .h-in::placeholder{color:var(--muted)}
.nn{display:none}
.cell.nonote .nn{display:block;position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;border:1.8px solid var(--warn);pointer-events:none}
.locked .cell{border-style:solid;border-color:var(--faint);cursor:default}
.locked .cell .h-in{cursor:pointer}
.locked .n-in{background:transparent;resize:none}

.r-diary{align-items:start;padding:2px 0 2px;cursor:default}
.r-diary[hidden]{display:none}
.hidden-rows{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.hidden-rows .chip{height:28px;font-family:var(--font-ui);font-weight:520;display:inline-flex;align-items:center;gap:6px}
.add-line{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.bbar{display:flex;align-items:center;gap:8px}
.bbar .track{flex:1;height:6px;border-radius:3px;background:var(--faint);position:relative;overflow:hidden}
.bbar .val{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--muted)}
.bbar.lv1 .val,.levels.lv1 .val{background:var(--accent)}
.bbar.lv2 .val,.levels.lv2 .val{background:var(--warn)}
.bbar.lv3 .val,.levels.lv3 .val{background:var(--alarm)}
.n-in{width:100%;min-height:88px;resize:vertical;padding:7px 8px;border:1px solid var(--rule);border-radius:10px;background:var(--paper);font-size:12.5px;line-height:1.4;outline:none}
.n-in:focus{border-color:var(--pc,var(--accent));background:var(--chrome);box-shadow:0 0 0 2px color-mix(in srgb,var(--pc,var(--accent)) 25%,transparent)}
.n-in::placeholder{color:var(--muted);opacity:.8}
.d-day{display:flex;flex-direction:column;gap:5px;min-width:0}
.sugg{display:flex;flex-wrap:wrap;gap:4px}
.sugg:empty{display:none}
.sg{max-width:100%;text-align:left;padding:4px 8px;border:1px solid color-mix(in srgb,var(--pc,var(--accent)) 35%,var(--rule));border-radius:999px;background:color-mix(in srgb,var(--pc,var(--accent)) 10%,var(--chrome));font-size:12px;line-height:1.3}
.sg:hover{background:color-mix(in srgb,var(--pc,var(--accent)) 20%,var(--chrome))}
.sg-label{width:100%;font-size:11px;color:var(--muted)}
.linkish{border:0;background:none;padding:0;color:var(--accent-ink);font-size:12px;text-align:left;text-decoration:underline;text-underline-offset:2px}

.add-row{justify-self:start;display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border:1px dashed var(--muted);border-radius:12px;background:transparent;font-weight:560;font-size:13px}
.add-row:hover{background:var(--chrome);border-style:solid}
.add-row small{color:var(--muted);font-weight:400}

/* Sammanställning */
.summary{background:var(--chrome);border:1px solid var(--rule);border-radius:13px;padding:8px 6px 8px}
.s-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;margin-bottom:6px;padding:0 7px}
.s-head h2{margin:0;font-size:14px;font-weight:650}
.legend{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.lg-norm{width:14px;border-top:2px dashed var(--muted)}
.stats{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;margin-left:auto}
.stat{display:flex;align-items:baseline;gap:6px;padding:4px 10px;border:1px solid transparent;border-radius:8px;background:var(--paper);white-space:nowrap}
button.stat:hover{border-color:var(--rule)}
.stat .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.stat .v{font:500 14px var(--font-data)}
.stat .v.neg{color:var(--warn-ink)}
.stat .v.pos{color:var(--ok)}
.chart{align-items:end;padding:0}
.s-foot{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:6px;padding:6px 7px 0;border-top:1px dashed var(--rule)}
.s-foot .sf{display:inline-flex;align-items:baseline;gap:6px;border:0;background:none;padding:2px 0;font-size:12.5px;color:var(--muted)}
.s-foot .sf .ic{width:15px;height:15px;align-self:center}
.s-foot .sf b{font-size:13px;font-weight:500;color:var(--ink)}
.s-foot .sf b.neg{color:var(--warn-ink)}
.s-foot .sf b.pos{color:var(--ok)}
.s-foot .sf:hover{color:var(--accent-ink)}
.s-foot .sf-sub{font-size:12px}
.s-foot .sf-sub .mono{font-size:12px}
.s-foot .sf-sub .neg{color:var(--warn-ink)}
.s-foot .sf-sub .pos{color:var(--ok)}
.app.compact .s-foot{margin-top:3px;padding-top:3px}
.bar-col{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.bar{position:relative;width:100%;height:var(--bar-h2,56px);border-radius:10px;border:1px dashed var(--rule);background:transparent;display:flex;flex-direction:column-reverse;overflow:hidden}
.bar:has(span){border-style:solid}
.bar span{display:block;width:100%;flex-shrink:0;border-top:1px solid var(--chrome)}
.bar .norm{position:absolute;left:-2px;right:-2px;border-top:2px dashed color-mix(in srgb,var(--ink) 55%,transparent);pointer-events:none}
.b-lbl{display:flex;gap:6px;align-items:baseline}
.bt{font:500 12.5px var(--font-data)}
.bs{font:11.5px var(--font-data);color:var(--muted)}
.bs.neg{color:var(--warn-ink)}
.bs.pos{color:var(--ok)}

/* Veckostatus (avcheckning) */
.wkstate{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:7px 8px 7px 12px;border-radius:11px;background:color-mix(in srgb,var(--ok) 12%,var(--chrome));border:1px solid color-mix(in srgb,var(--ok) 40%,transparent);font-size:13px}
.wkstate>.ic{color:var(--ok)}
.wkstate .txt{flex:1 1 240px}
.wkstate.signed{background:color-mix(in srgb,var(--sig) 12%,var(--chrome));border-color:color-mix(in srgb,var(--sig) 40%,transparent)}.wkstate.signed>.ic{color:var(--sig)}
.btn.done.sig{background:color-mix(in srgb,var(--sig) 14%,var(--chrome));border-color:color-mix(in srgb,var(--sig) 50%,transparent);color:var(--sig)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px}
.btn.done{background:color-mix(in srgb,var(--ok) 14%,var(--chrome));border-color:color-mix(in srgb,var(--ok) 50%,transparent);color:var(--ok)}
.miss{display:flex;flex-direction:column;gap:4px;margin:0 0 4px;padding:0;list-style:none;max-height:260px;overflow:auto}
.miss li{--pc:var(--p0);display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:9px;background:var(--paper);font-size:13px}
.miss li .r-text{flex:1}

/* Budgetring */
.ring{flex-shrink:0}
.ring .rt{fill:none;stroke:var(--faint);stroke-width:3.2}
.ring .rv{fill:none;stroke:var(--muted);stroke-width:3.2;stroke-linecap:round}
.ring.lv1 .rv{stroke:var(--accent)}
.ring.lv2 .rv{stroke:var(--warn)}
.ring.lv3 .rv{stroke:var(--alarm)}
.ring text{font:600 7.5px var(--font-data);fill:var(--muted);text-anchor:middle;dominant-baseline:central}
.ring.lv2 text{fill:var(--warn-ink)}
.ring.lv3 text{fill:var(--alarm-ink)}

/* Dagvy */
.day-strip{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:6px}
.ds{display:grid;justify-items:center;gap:3px;padding:7px 2px 8px;border:1px solid var(--rule);border-radius:12px;background:var(--chrome);font-size:12px}
.ds .dn{text-transform:uppercase;letter-spacing:.06em;font-size:10.5px;font-weight:600;color:var(--muted)}
.ds .dd{font:500 15px var(--font-data)}
.ds .mini{width:70%;height:5px;border-radius:3px;background:var(--faint);overflow:hidden}
.ds .mini i{display:block;height:100%;background:var(--accent);border-radius:3px}
.ds .tt{font:12px var(--font-data);color:var(--muted)}
.ds[aria-pressed="true"]{border:2px solid var(--accent);padding:6px 1px 7px;background:var(--accent-soft)}
.ds.today .dn{color:var(--accent-ink)}
.dcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:10px;align-items:start}
.dcard{--pc:var(--p0);background:var(--chrome);border:1px solid var(--rule);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.dcard.empty{background:transparent;border-style:dashed}
.dc-head{display:flex;align-items:center;gap:10px}
.dc-head .r-text{flex:1}
.dt-head{display:flex;align-items:center;gap:8px;min-height:32px;margin-top:2px;padding-top:8px;border-top:1px dashed var(--rule)}
.dt-head .t-name{flex:1;min-width:0;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dt-head .icon-btn{width:30px;height:30px}
.dcard.grp .n-in{min-height:60px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper .sbtn{width:44px;height:44px;border:1px solid var(--rule);border-radius:11px;background:var(--paper);display:inline-flex;align-items:center;justify-content:center}
.stepper .sbtn:hover{border-color:var(--muted)}
.dv-h{position:relative;flex:1;height:44px;border-radius:11px;border:1px solid var(--rule);background:linear-gradient(to right,color-mix(in srgb,var(--pc) 24%,transparent) calc(var(--f,0) * 100%),var(--paper) calc(var(--f,0) * 100%))}
.dv-h:focus-within{border-color:var(--pc);box-shadow:0 0 0 2px color-mix(in srgb,var(--pc) 30%,transparent)}
.dv-h .h-in{width:100%;height:100%;border:0;background:transparent;text-align:center;font:500 17px var(--font-data);outline:none}
.dv-h.nonote .nn{display:block;position:absolute;top:6px;right:8px;width:8px;height:8px;border-radius:50%;border:1.8px solid var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{height:32px;padding:0 11px;border:1px solid var(--rule);border-radius:999px;background:var(--paper);font:500 12.5px var(--font-data)}
.chip.danger{color:var(--warn-ink);display:inline-flex;align-items:center;gap:5px}.chip.danger .ic{width:14px;height:14px}
.cp-chips{margin:6px 0 2px}.cp-chips .chip{height:28px;padding:0 10px}
.p-link{all:unset;cursor:pointer;display:block;min-width:0;border-radius:6px}.p-link:hover h2{text-decoration:underline;text-underline-offset:3px}.p-link:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip:hover{border-color:var(--muted)}
.chip.txt{font-family:var(--font-ui);font-weight:560}
.day-sum{display:flex;flex-wrap:wrap;gap:8px 18px;padding:12px 14px;border-radius:12px;background:var(--chrome);border:1px solid var(--rule);font-size:13px;color:var(--muted)}
.day-sum b{font:500 14px var(--font-data);color:var(--ink)}

/* Egenskapspanel – komplement till smartmenyn; minimeras automatiskt när tidboken inte ryms */
.panel{grid-area:panel;position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--chrome);border-left:1px solid var(--rule)}
.p-resize{position:absolute;left:-5px;top:0;bottom:0;width:10px;cursor:col-resize;z-index:5;touch-action:none}
.p-resize::after{content:"";position:absolute;left:4px;top:50%;width:2px;height:36px;margin-top:-18px;border-radius:2px;background:var(--rule);opacity:0;transition:opacity .15s}
.p-resize:hover::after,.app.resizing .p-resize::after{opacity:1;background:var(--accent)}
.app.resizing{cursor:col-resize;user-select:none}
.p-body{flex:1;min-height:0;overflow:auto;padding-right:env(safe-area-inset-right,0px)}
.p-head{--pc:var(--p0);display:flex;align-items:flex-start;gap:10px;padding:12px 10px 10px 16px;border-bottom:1px solid var(--rule)}
.p-head .dot{margin-top:6px}
.p-head h2{margin:0;font-size:16px;font-weight:650;letter-spacing:-.01em;line-height:1.25}
.p-head p{margin:3px 0 0;color:var(--muted);font-size:12.5px}
.p-head .p-tools{margin-left:auto;display:flex;gap:2px}
.p-head .icon-btn{width:32px;height:32px}
.p-min{display:none;flex-direction:column;align-items:center;gap:10px;padding:10px 0}
.p-min .vlabel{writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.app.pmin{grid-template-columns:var(--rail-w) minmax(0,1fr) 46px}
.app.pmin .panel>*:not(.p-min){display:none}
.app.pmin .p-min{display:flex}
.psec{padding:12px 16px;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:9px}
.psec h3{margin:0;font-size:10.5px;font-weight:650;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.psec .row2{display:flex;align-items:center;justify-content:space-between;gap:8px}
.p-hours{flex:1;height:44px;border:1px solid var(--rule);border-radius:12px;background:var(--paper);text-align:center;font:500 20px var(--font-data);outline:none;min-width:0}
.p-hours:focus{border-color:var(--pc,var(--accent));background:var(--chrome)}
.small{font-size:12.5px}
.dlist{display:flex;flex-direction:column;gap:4px;margin:0;padding:0;list-style:none}
.dlist button{--pc:var(--p0);width:100%;display:flex;align-items:flex-start;gap:10px;padding:8px;border:0;border-radius:9px;background:var(--paper);text-align:left}
.dlist button:hover{background:var(--faint)}
.dlist .dot{margin-top:4px}
.dlist .r-text{flex:1}
.dlist .hv{font:500 13px var(--font-data)}
.dlist .nt{font-size:12px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dlist .nt.miss-n{color:var(--warn-ink)}
/* Panelen på alla sidor: nyckeltal, att göra och hjälp */
.pkv{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted)}
.pkv b{font:500 13px var(--font-data);color:var(--ink);text-align:right}
.pkv b small{font-size:11.5px;color:var(--muted);margin-left:6px}
.pkv.warn b,.pkv.warn>span{color:var(--warn-ink)}
.pkv.tot{border-top:1px solid var(--rule);padding-top:7px}
.pkv.big b{font-size:15px}
.plist button.pl{--pc:var(--p0);width:100%;display:flex;align-items:center;gap:10px;padding:7px 6px;border:0;border-radius:9px;background:none;text-align:left;color:inherit;font:inherit}
.plist button.pl:hover{background:var(--faint)}
.plist button.pl .r-text{flex:1;min-width:0}
.plist li.pl-li{padding:0}
.p-acts{display:flex;flex-wrap:wrap;gap:6px}
.p-note{margin:0;font-size:12px;color:var(--muted)}
.toc{display:flex;flex-direction:column;gap:2px;margin:0;padding:0;list-style:none}
.toc button{width:100%;text-align:left;padding:6px 8px;border:0;border-radius:8px;background:none;color:var(--ink);font:inherit;font-size:13px}
.toc button:hover{background:var(--faint)}

/* Smartmeny-popup vid pekaren (som i cad-apa) */
.cpop{--pc:var(--p0);position:fixed;z-index:82;width:min(330px,calc(100vw - 16px));display:flex;flex-direction:column;gap:8px;padding:10px;border:1px solid var(--rule);border-radius:14px;background:var(--chrome);box-shadow:var(--shadow)}
.cp-head{display:flex;align-items:center;gap:8px;font-size:12.5px;min-width:0}
.cp-head .r-name{font-size:13px}
.cp-head .r-text{flex:1}
.cp-head .icon-btn{width:28px;height:28px}
.cp-h{display:flex;align-items:center;gap:6px}
.cp-h .sbtn{width:32px;height:32px;border:1px solid var(--rule);border-radius:9px;background:var(--paper);display:inline-flex;align-items:center;justify-content:center}
.cp-h .sbtn:hover{border-color:var(--muted)}
.cp-h .hbox{position:relative;width:76px;height:32px;border:1px solid var(--rule);border-radius:9px;background:var(--paper)}
.cp-h .hbox:focus-within{border-color:var(--pc)}
.cp-h .h-in{width:100%;height:100%;border:0;background:transparent;text-align:center;font:500 15px var(--font-data);outline:none}
.cp-h .day{margin-left:auto;font:12px var(--font-data);color:var(--muted)}
.cpop .n-in{min-height:84px}
.cp-acts{display:flex;gap:2px;padding-top:6px;border-top:1px solid var(--rule)}
.cp-acts button{flex:1;display:grid;justify-items:center;gap:3px;padding:6px 2px 5px;border:0;border-radius:9px;background:transparent;font-size:10.5px;font-weight:550;color:var(--ink)}
.cp-acts button .ic{width:19px;height:19px;color:var(--accent-ink)}
.cp-acts button:hover{background:var(--paper)}
.cp-acts button.danger,.cp-acts button.danger .ic{color:var(--alarm-ink)}
.cp-acts button[aria-disabled="true"]{color:var(--muted);cursor:default;opacity:.55}
.cp-acts button[aria-disabled="true"] .ic{color:var(--muted)}
.cp-lock{font-size:12px;color:var(--muted)}
.acct{font-size:12px;color:var(--muted);line-height:1.4}
.acct b{color:var(--ink);font-weight:500}
.acct b.neg{color:var(--warn-ink)}
.psec .acct{margin-top:6px}

.bud{display:flex;align-items:center;gap:14px}
.bud .big{font:500 15px var(--font-data)}
.levels{position:relative;height:10px;border-radius:5px;background:var(--faint)}
.levels .val{position:absolute;inset:0 auto 0 0;border-radius:5px;background:var(--muted);max-width:100%}
.levels .tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--chrome)}
.lv-lbl{position:relative;height:14px;font:11px var(--font-data);color:var(--muted)}
.lv-lbl span{position:absolute;transform:translateX(-50%)}
.notice{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;background:var(--paper);font-size:12.5px}
.notice .ic{color:var(--ok)}
.hist{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.hist li{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12.5px;padding:8px 10px;border-radius:9px;background:var(--paper)}
.hist .hd{font:11.5px var(--font-data);color:var(--muted);grid-row:span 2}
.hist .ht{min-width:0;overflow-wrap:anywhere}
.hist .linkish{justify-self:start}
.plist{display:flex;flex-direction:column;gap:2px;margin:0;padding:0;list-style:none}
.plist li{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:9px}
.plist .r-text{flex:1}
.tips{margin:0;padding-left:18px;color:var(--muted);font-size:12.5px;display:flex;flex-direction:column;gap:6px}
.tips b{color:var(--ink);font-weight:600}

/* Statusrad */
.status{grid-area:status;display:flex;align-items:center;gap:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--chrome);border-top:1px solid var(--rule);color:var(--muted);font:12px var(--font-data);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.status .label{font-family:var(--font-ui);font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-right:6px}
.status .value{color:var(--ink)}
.status .end{margin-left:auto}

/* Smartmeny, popover, dialog, toast */
.ctx-menu{position:fixed;z-index:80;min-width:240px;max-width:min(340px,calc(100vw - 16px));display:grid;padding:5px;border:1px solid var(--rule);border-radius:12px;background:var(--chrome);box-shadow:var(--shadow)}
.ctx-menu .mh{padding:6px 10px 6px;font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:8px}
.ctx-menu button{display:flex;align-items:center;gap:10px;padding:8px 10px;border:0;border-radius:8px;background:transparent;text-align:left;font-weight:520;font-size:13px}
.ctx-menu button .ic{color:var(--accent-ink)}
.ctx-menu button:hover,.ctx-menu button:focus-visible{background:var(--paper);outline:none}
.ctx-menu button.danger,.ctx-menu button.danger .ic{color:var(--alarm-ink)}
.ctx-menu button[aria-disabled="true"]{color:var(--muted);cursor:default}
.ctx-menu button[aria-disabled="true"] .ic{color:var(--muted)}
.ctx-menu hr{border:0;border-top:1px solid var(--rule);margin:4px 2px}
.ctx-menu kbd{margin-left:auto}

.paper{background:var(--chrome);border:1px solid var(--rule);border-radius:6px;padding:28px 32px;box-shadow:0 2px 10px rgb(20 28 34 / .06);max-width:820px;width:100%;margin:0 auto;font-size:12.5px}

.pp-facts dd{margin:1px 0 0}
.pp-t{width:100%;border-collapse:collapse;margin-bottom:10px}

@media (width <= 760px){.paper{padding:16px 14px}.pp-facts{grid-template-columns:minmax(0,1fr)}.rep-acts{margin-left:0}.pp-top{flex-direction:column}.pp-info{align-items:flex-start;text-align:left}}

/* ───── 0.6: fältmeddelanden, kundfält med autokomplettering, fri färg, löpande projekt ───── */
.fld-hint{font-size:11.5px;color:var(--muted);min-height:0}

.sw-free input[type=color]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
.runbox{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:11px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);font-size:12.5px;line-height:1.45}

.runbox.big{font-size:13.5px;padding:12px 14px}

.neg{color:var(--alarm-ink)}

/* Listor: sök, filter och sortering */
.list-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.lsearch{flex:1 1 240px;display:flex;align-items:center;gap:6px;height:38px;padding:0 4px 0 10px;border:1px solid var(--rule);border-radius:10px;background:var(--chrome);color:var(--muted)}
.lsearch:focus-within{border-color:var(--accent)}
.lsearch input{flex:1;min-width:0;height:100%;border:0;background:transparent;outline:none;color:var(--ink)}

/* Kort som går att klicka på */
.pcard.click,.ccard.click{cursor:pointer;transition:border-color .12s,box-shadow .12s}
.pcard.click:hover,.ccard.click:hover{border-color:color-mix(in srgb,var(--pc,var(--muted)) 55%,var(--rule));box-shadow:0 4px 14px rgb(20 28 34 / .07)}

.money b{font:600 14px var(--font-data);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.pc-foot{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-note{font-style:italic}
.pbtns{display:flex;flex-direction:column;gap:4px}
.pbtn{--pc:var(--p0);display:flex;align-items:center;gap:9px;width:100%;padding:7px 9px;border:1px solid var(--rule);border-left:3px solid var(--pc);border-radius:9px;background:var(--paper);text-align:left;color:var(--ink)}

/* Detaljsidor för projekt och kunder */

.dp-top{margin-bottom:-6px}

@container (width < 700px){.dp-head{grid-template-columns:auto minmax(0,1fr);align-items:start}.dp-head .dot.big{margin-top:6px}.dp-head .av.big{margin-top:0}.dp-acts{grid-column:1 / -1}}

.dp-kpi .k-open.on .k,.dp-kpi .k-open.on b{color:var(--o-ink)}
.dp-kpi .k-done b{color:var(--ok)}
.dp-bud{padding:12px 14px;border:1px solid var(--rule);border-radius:12px;background:var(--chrome)}
.dp-cols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:12px;align-items:start}
.dp-col{display:flex;flex-direction:column;gap:12px;min-width:0}
@container (width < 820px){.dp-cols{grid-template-columns:minmax(0,1fr)}}
.dsec{background:var(--chrome);border:1px solid var(--rule);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}

.pgrid.one{grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr))}

.dtab td{padding:6px 6px;border-bottom:1px solid var(--faint);vertical-align:middle}

/* Så påverkas summan (0.17.2) */
.pg-wrap{overflow-x:auto;margin:6px 0 10px}.pg-tab .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pc);margin-right:6px;vertical-align:1px}
.pg-tab .pg-p td{border-top:1px solid var(--rule)}.pg-tab .pg-t td:first-child{padding-left:20px}.pg-tab .tot td{font-weight:650;border-top:1px solid var(--rule)}
.pg-tab td:first-child{min-width:130px}.pg-tab .rt-s{white-space:nowrap}@media (max-width:560px){.pg-tab .r-num{display:none}.pg-tab{font-size:12px}.pg-tab td,.pg-tab th{padding-left:3px;padding-right:3px}.pg-tab td:first-child{min-width:0}.pg-tab .rt-s{white-space:normal;display:block}}
.pg-tab .neg{color:var(--warn-ink)}.pg-tab .pos{color:var(--ok)}.pg-tab .r-num{margin-right:6px;color:var(--muted);font-family:var(--font-data)}
.pg-ask{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:8px 0;padding:8px 10px;border-radius:8px;background:var(--warn-soft)}

.st-done .ic{width:13px;height:13px}
.st-done.part{color:color-mix(in srgb,var(--ok) 70%,var(--muted));font-weight:520;margin-right:6px}
.mo-c.hd.part{background:color-mix(in srgb,var(--ok) 6%,transparent)}.ic.mo-l.part{opacity:.55}
.hd-list{list-style:none;margin:0;padding:0}.hd-list li{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}.hd-list li:last-child{border-bottom:0}.hd-list .hd-p{flex:1;min-width:0}.hd-list .hd-p small{display:block;color:var(--muted);font-size:11.5px}
.st-ready,.st-wait{display:inline-flex;align-items:center;gap:3px;margin-left:8px;font-size:11.5px;font-weight:560;color:var(--ok)}.st-wait{color:var(--warn-ink)}.st-ready .ic,.st-wait .ic{width:12px;height:12px}

.notes li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:start;padding:7px 0;border-top:1px solid var(--faint);font-size:13px}
.notes li:first-child{border-top:0}

@media (width <= 760px){.money b{font-size:13px}.dp-head h1{font-size:19px}.dp-acts{width:100%}.note-add{flex-direction:column;align-items:stretch}}

.dlg p.fld{margin:0;display:block}
.alert.fld{flex-direction:row}
.s-foot:empty{display:none}
/* ───── 0.7: månadsvy ───── */

    proj4: ['Bokföring och fakturaunderlag', 'Uppdatering av hemsidan', 'Anbud ramavtal', 'Kurs i BEAst']
  };
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const pick = a => a[Math.floor(rnd() * a.length)];
  const rate = { proj1: 950, proj2: 1000, proj3: 1150, proj4: 950, proj5: 950 };
  const role = { proj1: 'roll1', proj2: 'roll1', proj3: 'roll2', proj4: 'roll1', proj5: 'roll1' };
  const add = (date, p, task, hours, note) => {
    const at = pd(date); at.setHours(17, 5); const iso = at.toISOString();
    evs.push({ id: uid(), entryId: uid(), type: 'create', at: iso, by: pid, data: { date, projectId: p, taskId: task, roleId: role[p], hours, note, rate: rate[p] } });
  };
  const notesFor = p => { const a = pick(notes[p]); const b = pick(notes[p]); return rnd() < .45 && a !== b ? `${a}. ${b}` : a; };
  // Aktuell vecka (som i mockupen), bara dagar till och med i dag
  const cur = [
    [0, 'proj1', 'upg1', 2, 'Telefonmöte med beställaren om fönstersättning och kulörval'], [0, 'proj2', 'upg3', 5, ''], [0, 'proj4', 'upg5', 1, 'Bokföring och fakturaunderlag'],
    [1, 'proj1', 'upg1', 3, 'Genomgång av föreläggande om komplettering. Ritade fasad mot öster'], [1, 'proj2', 'upg3', 2, 'Samordningsmöte med konstruktör'], [1, 'proj3', 'upg4', 1, 'Lokalprogram, genomgång med verksamheten'],
    [2, 'proj1', 'upg1', 3.5, 'Bygglovskomplettering: ritade fasad mot väster, justerade fönstersättning'], [2, 'proj2', 'upg3', 2.5, 'Projekteringsmöte'], [2, 'proj3', 'upg4', 2, 'Platsbesök, fotodokumentation']
  ];
  const curH = { proj1: 0, proj2: 0, proj3: 0 };
  const curEv = [];
  for (const [i, p, task, h, n] of cur) { const d = addD(mon, i); if (d > t) continue; curEv.push([d, p, task, h, n]); curH[p] += h; }
  // Mål: Smeden 92 %, Strand 80 %, Lärkan 12 % av budgeten
  const target = { proj2: 202.5 - curH.proj2, proj1: 126.5 - curH.proj1, proj3: 31.5 - curH.proj3 };
  const start = { proj2: -12, proj1: -10, proj3: -3 };
  const prob = { proj2: .78, proj1: .62, proj3: .7 };
  // Frånvaro i exemplet: två semesterdagar och en kompledig dag
  const absDay = { [addD(mon, -32)]: 'upg10', [addD(mon, -31)]: 'upg10', [addD(mon, -17)]: 'upg8' };
  const days = [];
  for (let w = -12; w <= -1; w++) for (let i = 0; i < 5; i++) { const d = addD(mon, w * 7 + i); if (!absDay[d]) days.push([w, d]); }
  // fördela baklänges så att projekten "landar" i aktuell vecka
  const left = { ...target };
  const out = [];
  for (const [w, d] of days.slice().reverse()) {
    let dayH = 0;
    for (const p of ['proj2', 'proj1', 'proj3']) {
      if (w < start[p] || left[p] <= 0 || rnd() > prob[p]) continue;
      let h = Math.min(pick([1.5, 2, 2.5, 3, 3.5, 4]), left[p], 7.5 - dayH);
      h = Math.round(h * 2) / 2; if (h <= 0) continue;
      left[p] -= h; dayH += h;
      out.push([d, p, p === 'proj1' ? (w < -7 ? 'upg2' : 'upg1') : p === 'proj2' ? 'upg3' : 'upg4', h, rnd() < .9 ? notesFor(p) : '']);
    }
  }
  // det som blev kvar läggs på de äldsta dagarna
  const dayTot = d => out.reduce((s, r) => r[0] === d ? s + r[3] : s, 0);
  for (const p of ['proj2', 'proj1', 'proj3']) { let i = 0; while (left[p] > 0.01 && i++ < 200) { const cand = days.filter(([w]) => w >= start[p]).map(([, d]) => [d, dayTot(d)]).sort((a, b) => a[1] - b[1])[0]; const h = Math.min(1.5, left[p]); left[p] -= h; out.push([cand[0], p, p === 'proj1' ? 'upg1' : p === 'proj2' ? 'upg3' : 'upg4', h, notesFor(p)]); } }
  // fyll ut med intern tid så att dagarna landar runt normtiden (ger ett rimligt kompsaldo)
  for (const [, d] of days) {
    const tot = out.reduce((s, r) => r[0] === d ? s + r[3] : s, 0), goal = 8 + pick([-0.5, 0, 0, 0, 0, 0.5, 1]);
    if (tot < goal) out.push([d, 'proj4', pick(['upg5', 'upg5', 'upg6', 'upg7']), Math.round((goal - tot) * 2) / 2, notesFor('proj4')]);
  }
  for (const d in absDay) out.push([d, 'proj5', absDay[d], 8, '']);
  const merged = new Map();
  for (const r of [...out, ...curEv]) { const k = r[0] + r[1] + r[2]; if (merged.has(k)) { const m = merged.get(k); m[3] += r[3]; if (r[4] && !m[4].includes(r[4])) m[4] = m[4] ? m[4] + '. ' + r[4] : r[4]; } else merged.set(k, [...r]); }
  [...merged.values()].sort((a, b) => a[0] < b[0] ? -1 : 1).forEach(r => add(...r));
  book.prefs.weekRows[mon] = ['proj1~upg1', 'proj2~upg3', 'proj3~upg4', 'proj4~upg5'];
  // förra veckan avcheckad, veckan innan dess även signerad av administratören
  for (const [n, sign] of [[-7, false], [-14, true]]) {
    const wk = addD(mon, n), at = pd(addD(wk, 4)); at.setHours(17, 30);
    evs.push({ id: uid(), entryId: null, type: 'week', at: at.toISOString(), by: pid, data: { week: wk, checked: true } });
    if (sign) { at.setDate(at.getDate() + 3); reg.signed[pid + '|' + wk] = { at: at.toISOString(), by: pid }; }
  }
  // Kv. Smeden: månaden för två månader sedan är avstämd och utskriven (hanterad och låst)
  const hm = ymd(new Date(pd(t).getFullYear(), pd(t).getMonth() - 2, 1)).slice(0, 7);
  reg.handled.proj2 = [{ id: 'h' + uid(), from: hm + '-01', to: ymLast(hm), at: new Date().toISOString(), by: pid }];
  return book;
}

// Versionerat format: gamla böcker ska alltid gå att öppna. Nya versioner lägger till ett steg här.
const MIGRATIONS = {
  // 1 → 2: anställningsform och kompsaldo per person, signering av veckor, dolda rader
  1: d => {
    const first = Object.values(d.logs || {}).flatMap(l => l.events).filter(e => e.type === 'create').map(e => e.data.date).sort()[0];
    for (const p of d.register.people) Object.assign(p, { employment: p.employment || 'full', pct: p.pct ?? 100, balanceStart: p.balanceStart || first || today(), balanceIn: p.balanceIn ?? 0 });
    d.register.signed = d.register.signed || {};
    d.prefs = d.prefs || {}; d.prefs.hiddenRows = d.prefs.hiddenRows || {};
    d.version = 2; return d;
  },
  // 2 → 3: format för projektnummer, frånvaroprojekt och semesterkonto per person
  2: d => {
    d.register.book.numberFormat = d.register.book.numberFormat || '{år}-{löpnummer2}';
    if (!d.register.projects.some(p => p.kind === 'absence')) d.register.projects.push(absenceProject());
    for (const p of d.register.people) p.vacation = p.vacation || { perYear: 25, yearStart: '04-01', carried: 0 };
    d.version = 3; return d;
  },
  // 3 → 4: egna förkortningar för smartanteckningen (project.abbr, task.abbr); frånvaron får standardförkortningar
  3: d => {
    for (const p of d.register.projects) if (p.kind === 'absence') for (const t of p.tasks) if (t.abbr == null) { const a = ABSENCE.find(x => x[0] === t.absence); if (a) t.abbr = a[2]; }
    d.version = 4; return d;
  },
  // 4 → 5: Sjuk och VAB som frånvarotyper; kunduppgifter, logga, årsarbetstid och låsning av hanterade månader (standardvärden sätts i migrate)
  4: d => {
    const ab = d.register.projects.find(p => p.kind === 'absence');
    const taken = new Set(d.register.projects.flatMap(p => [p.abbr, ...p.tasks.map(t => t.abbr)]).flatMap(a => String(a || '').toLowerCase().split(/[\s,]+/)).filter(Boolean));
    if (ab) for (const [absence, name, abbr] of ABSENCE) if (!ab.tasks.some(t => t.absence === absence)) ab.tasks.push({ id: 'u' + uid(), name, billable: false, absence, ...(taken.has(abbr) ? {} : { abbr }) });
    for (const k in d.register.handled || {}) if (typeof d.register.handled[k] !== 'object' || !d.register.handled[k]) d.register.handled[k] = { at: new Date().toISOString(), by: d.session?.personId || null };
    d.version = 5; return d;
  },
  // 5 → 6: projekt och kunder får skapad-datum, anteckningar och tid till inaktiv. Dolda rader finns inte längre:
  // rader som var dolda men hade tid visas igen (inget ska försvinna utan att användaren vet om det).
  5: d => {
    const reg = d.register, created = reg.book.created || new Date().toISOString();
    reg.book.idleDays = reg.book.idleDays ?? 90;
    reg.book.team = reg.book.team || 'solo';
    for (const p of reg.projects) { p.created = p.created || created; p.notes = p.notes || []; }
    for (const c of reg.customers) { c.created = c.created || created; c.notes = c.notes || []; }
    const hid = d.prefs?.hiddenRows || {};
    for (const wk in hid) { const W = d.prefs.weekRows = d.prefs.weekRows || {}, a = W[wk] = W[wk] || []; for (const rk of hid[wk]) if (!a.includes(rk)) a.push(rk); }
    if (d.prefs) d.prefs.hiddenRows = {};
    d.version = 6; return d;
  },
  // 6 → 7: sparad semester per år. "Sparade dagar in i året" (carried) blir sparade dagar från förra semesteråret,
  // räknat från innevarande semesterår. Regler för sparande ligger i boken (book.vacation).
  6: d => {
    const B = d.register.book; B.vacation = Object.assign({}, VAC_DEF, B.vacation || {});
    for (const p of d.register.people) {
      const v = p.vacation = p.vacation || { perYear: 25, yearStart: '04-01' };
      if (!v.from) v.from = semStart(today(), v.yearStart || '04-01');
      if (!Array.isArray(v.saved)) v.saved = +v.carried > 0 ? [+v.carried] : [];
      delete v.carried;
    }
    d.version = 7; return d;
  },
  // 7 → 8: hanterad tid som datumintervall per projekt (förut bara hela månader, 'projektId|ÅÅÅÅ-MM').
  // Id:t räknas fram ur månaden, så att samma bok migrerad på två enheter slås ihop utan dubbletter.
  // Egna kommandon i smartshell (prefs.aliases) – de tre som var inbyggda följer med och kan tas bort.
  7: d => {
    const old = d.register.handled || {}, hd = {};
    for (const k of Object.keys(old).sort()) {
      const [pid, ym] = k.split('|'), v = isObj(old[k]) ? old[k] : {};
      if (!pid || !/^\d{4}-\d{2}$/.test(ym || '')) continue;
      (hd[pid] = hd[pid] || []).push({ id: 'm' + ym, from: ym + '-01', to: ymLast(ym), at: v.at || ym + '-01T00:00:00.000Z', by: v.by ?? null, ...(v.hours != null ? { hours: v.hours } : {}), ...(v.amount != null ? { amount: v.amount } : {}) });
    }
    d.register.handled = hd;
    d.prefs = d.prefs || {};
    if (!isObj(d.prefs.aliases)) d.prefs.aliases = { 'db-rapp': 'db', 'db-rp': 'db', 'dbrapp': 'db' };
    d.version = 8; return d;
  },
  // 8 → 9: fakturor (ett tillägg som är av tills det slås på – book.invoicing) och loggorna som fakturorna använde
  8: d => {

/* ───────────── Organisationer (0.16.1 – etapp 4, steg 2: servern) ─────────────
   En organisation är en bok som flera personer delar via servern. Boken ligger där i delar (Delar och nycklar):
   registret, fakturorna och personkorten skrivs av organisationens admin, varje tidlogg av personen själv. Servern
   lagrar delarna var för sig och kontrollerar skribenten; den ser bara vem som skrev en del och till vilka den är
   krypterad. Varje enhet hämtar de delar som är krypterade till personen, slår ihop dem med sin bok och skickar bara
   de delar personen skriver och som har ändrats (st.web.ph = kontrollsumma per del som den ligger på servern).
   Flödet: serverns ägare ger en kod för en organisation → admin gör boken till en organisation → admin bjuder in en
   medarbetare (personen läggs in i boken och får en kod) → medarbetaren skapar konto med koden (eller går med med ett
   befintligt konto) och lämnar sina offentliga nycklar → admin godkänner nyckeln (fingeravtrycket) → admins enhet
   krypterar registret, personens kort och tidlogg till personen → medarbetaren ser boken och rapporterar tid.
   Medarbetaren skriver bara sin tidlogg (och sina inställningar); ändringar i annat tas bort vid nästa synk.
   Registrets signatur fästs på enheten första gången (st.web.pin) – byts registrets nyckel stoppas synken. */
const partHash = async (obj, pids) => (await sha256(canon(obj))) + '|' + [...pids].sort().join(',');
function orgCanWrite(n) {
  const w = st.web; if (!w?.org) return false;
  if (n === 'log.' + w.pid) return true;
  if (w.role !== 'admin') return false;
  // admin förvaltar en tidlogg tills personen själv har skrivit den (innan personen gått med)
  return n.startsWith('log.') ? !(w.wrote || []).includes(n.slice(4)) : true;
}
// Läget i organisationen från servern (info eller get)
async function orgSrv(o) {
  if (!o || !st.web) return;
  const p = {};
  if (o.role && o.role !== st.web.role) p.role = o.role;
  if (o.name && o.name !== st.web.orgName) p.orgName = o.name;
  if (Array.isArray(o.wrote) && !jeq(o.wrote, st.web.wrote)) p.wrote = o.wrote;
  if (Object.keys(p).length) await webStore(p);
}
// Byt den här enheten till organisationen. keep = behåll basen (samma bok som förut, t.ex. en flyttad bok)

async function webSyncOrg() {

// Skicka de delar personen skriver och som har ändrats sedan servern såg dem. Returnerar 'none' (inget att skicka),

async function orgPut(raw, base, tries = 0) {

  const obj = JSON.parse(raw), reg = obj.register, org = reg?.org?.id || 'o', P = bookSplit(obj), parts = {}, H = {};

    const rc = partRecips(n, reg, k), h = await partHash(P[n], rc.map(x => x.pid));

    parts[n] = await partSeal(org, n, P[n], rc, k); H[n] = h;
  }
  if (!Object.keys(parts).length) { await webStore({ base: raw }); return 'none'; }
  const env = await encEnvelope(k);
  const r = await api('put', { body: JSON.stringify({ format: ENC_FORMAT, version: 2, app: APP_VERSION, saved: new Date().toISOString(), org, me: k.pid, ...env, parts }), headers: { 'X-Sisyfos-Base': String(base) } });
  await webStore({ rev: r.rev, saved: r.saved, base: raw, ph: { ...(st.web.ph || {}), ...H }, used: r.used, quota: r.quota });

  const w = st.web;
  if (!file.parts?.reg) {
    // Admin som just gjort boken till en organisation: skicka hela boken. En medarbetare väntar på admin.
    if (w.role === 'admin') { await keysEnsure(); flush(); const raw = JSON.stringify(S); await webStore({ rev: g.rev }); await orgPut(raw, g.rev); return; }
    await webStore({ rev: g.rev });
    throw Object.assign(new Error('väntar på admin'), { waiting: true });
  }
  const opt = { wrote: w.wrote || [] };
  const theirs = migrate(await decParts(file, st.enc.key, opt));
  if (w.pin && opt.regFp && opt.regFp !== w.pin) throw Object.assign(new Error('Registret i organisationen är signerat med en annan nyckel än förut. Synken är stoppad – fråga organisationens admin.'), { code: 'vault' });
  theirs.session = { personId: w.pid };
  await keysAdopt(file, !w.base, w.pid);
  const srvH = {};
  for (const n in opt.P) if (orgCanWrite(n) && file.parts[n]) srvH[n] = await partHash(opt.P[n], Object.keys(file.parts[n].to || {}));
  // Första gången: organisationens bok ersätter boken här (en ögonblicksbild tas först)
  if (!w.base) {
    st.webApplying = true; try { replaceBook(theirs, 'Före organisationens bok'); } finally { st.webApplying = false; }
    await webStore({ rev: g.rev, base: JSON.stringify(theirs), ph: srvH, pin: opt.regFp || null });
    toast(`Boken för ${w.orgName || 'organisationen'} är öppnad`);
    const r = await orgPut(JSON.stringify(S), g.rev).catch(e => { if (e.status === 409 && tries < 3) return 'pull'; throw e; });
    if (r === true || r === 'pull') return webPullOrg(tries + 1);
    return;
  }
  const cur = JSON.stringify(S), base = migrate(JSON.parse(w.base)), cf = [];
  const ov = orgOverlay(bookMerge(base, JSON.parse(cur), theirs, cf), theirs, base, JSON.parse(cur)), merged = ov.book;
  merged.session = { personId: w.pid };
  // Krockar i det personen inte skriver avgörs av servern – inget att fråga om
  for (let i = cf.length - 1; i >= 0; i--) { const p = cf[i].path; if (p[0] === 'register' ? w.role !== 'admin' : p[0] === 'logs' && !orgCanWrite('log.' + p[1])) cf.splice(i, 1); }
  const same = canon(merged) === canon(JSON.parse(cur));
  if (!same) { if (cf.length) await snapshot('Före sammanslagning med webben', cur, 'event'); webApply(merged); }
  await webStore({ rev: g.rev, base: JSON.stringify(theirs), ph: srvH, ...(w.pin ? {} : { pin: opt.regFp || null }) });
  let r;
  try { r = await orgPut(JSON.stringify(S), g.rev); }
  catch (e) { if (e.status === 409 && e.code === 'conflict' && tries < 3) return webPullOrg(tries + 1); throw e; }
  if (r === true && tries < 3) return webPullOrg(tries + 1);
  if (ov.reverted) toast(w.role === 'admin' ? 'Medarbetarnas tid ändras bara av dem själva – ändringen togs bort' : 'Projekt, kunder och inställningar ändras av organisationens admin – ändringen togs bort');
  else if (cf.length) webConflictDlg(cf.map(c => ({ ...c, label: cfLabel(c.path, JSON.parse(cur), theirs) })));
  else if (!same) toast('Boken uppdaterades från webben');
}
// Det personen inte skriver tas från servern; det personen inte får läsa finns inte med. reverted = en ändring på den här
// enheten i något personen inte skriver (t.ex. ett projekt för en medarbetare) har tagits bort.
function orgOverlay(m, t, b, o) {
  const A = bookSplit(m), T = bookSplit(t), Bs = bookSplit(b), O = bookSplit(o), P = {}; let reverted = false;
  for (const n of new Set([...Object.keys(A), ...Object.keys(T)])) {
    if (orgCanWrite(n)) { P[n] = A[n] !== undefined ? A[n] : T[n]; continue; }
    if (T[n] !== undefined) P[n] = T[n];
    if (O[n] !== undefined && canon(O[n]) !== canon(Bs[n] ?? null) && canon(O[n]) !== canon(T[n] ?? null)) reverted = true;
  }
  return { book: bookJoin(P), reverted };
}

// Skriver boken som <boknamn>.sisyfos.json (skrivs över) och en kopia per dag i undermappen Säkerhetskopior
async function dirWrite(force) {
  const d = st.dir; if (!d?.ok || st.noSave || (isExample() && !force)) return;
  const raw = JSON.stringify(S, null, 1), base = fileSafe(R().book.name || 'Sisyfos');
  const put = async (dir, name) => { const fh = await dir.getFileHandle(name, { create: true }), w = await fh.createWritable(); await w.write(raw); await w.close(); };
  try {
    await put(d.handle, `${base}.sisyfos.json`);
    const sub = await d.handle.getDirectoryHandle('Säkerhetskopior', { create: true });
    await put(sub, `${base} ${today()}.sisyfos.json`);
    d.err = null; d.last = new Date(); backedUp('mapp');
  } catch (e) {
    d.err = e.message; if (e?.name === 'NotAllowedError' || e?.name === 'SecurityError') d.ok = false;

}

function weekDays(wk) { return Array.from({ length: 7 }, (_, i) => addD(wk, i)); }
function visDays(wk) {
  const all = weekDays(wk);
  const weekendUsed = dayTotal(all[5]) > 0 || dayTotal(all[6]) > 0;

function fragments(pId, exclude) {

/* ───────────── Projektnummer med smarta taggar ─────────────
   {år} 2026 · {år2} 26 · {månad} 10 · {löpnummerN} löpnummer med N siffror ({löpnummer} utan utfyllnad).
   Löpnumret räknas per "familj": nästa nummer = högsta befintliga nummer med samma fasta delar + 1,
   så det börjar om på 1 när året (eller månaden) i numret byts. */
const NUM_TAGS = [['{år}', 'år', '2026'], ['{år2}', 'år, två siffror', '26'], ['{månad}', 'månad', '10'], ['{löpnummer2}', 'löpnummer', '07'], ['{löpnummer3}', 'löpnummer', '007']];

const DEF_NUMFMT = '{år}-{löpnummer3}';

function numFmt(fmt, d = today(), ctx = { projects: R().projects, start: R().book.serialStart }) {
  fmt = fmt || DEF_NUMFMT;

    const t = m[1].trim().toLowerCase().normalize('NFC'), sm = t.match(/^l[öo]pnummer(\d?)$/);
    if (t === 'år' || t === 'ar') { re += y; parts.push(y); yearTag = true; }
    else if (t === 'år2' || t === 'ar2') { re += y.slice(2); parts.push(y.slice(2)); yearTag = true; }
    else if (t === 'månad' || t === 'manad') { re += mo; parts.push(mo); monthTag = true; }
    else if (sm) { if (serial) { err = 'Använd bara ett löpnummer i formatet.'; continue; } serial = { digits: +sm[1] || 0, at: parts.length }; parts.push(null); re += '(\\d+)'; }
    else err = `Okänd tagg {${m[1]}}. Använd ${NUM_TAGS.map(x => x[0]).join(', ')}.`;
  }

}

}

  <p class="small">Personnummer, kontaktpersoner och anteckningar om människor är personuppgifter.</p>
  <h3>Var den sparas</h3>
  <ul><li><b>I den här webbläsaren, på den här enheten</b> (IndexedDB med en kopia i webbläsarens lokala lagring), tillsammans med automatiska ögonblicksbilder. En app installerad på iPhones hemskärm har en egen, separat lagring.</li>

  <li><b>I en organisation</b> (en bok som flera delar, 0.16.1) ligger boken på servern i delar – registret, fakturorna, ett personkort och en tidlogg per person – var och en krypterad till dem som får läsa den. Servern ser organisationens namn, medlemmarnas e-postadresser och roller, deras offentliga nycklar, vem som skrev varje del och till vilka den är krypterad, och delarnas storlek och tidpunkter – inte innehållet. En medarbetares tid kan bara läsas av personen och organisationens admin; fakturorna bara av admin. Admin bjuder in och tar bort medarbetare. Den som driver servern ser organisationens namn, admins e-post och antalet personer.</li>
  <li><b>Ingen annan kan läsa boken</b> – inte heller Agrell Arkitektur, som gör Sisyfos och driver servern. Det betyder också att ingen kan återställa den åt dig: glömmer du både lösenordet och återställningsnyckeln, eller rensar du webbplatsdata utan konto eller kopia, är boken borta.</li>
  <li><b>Ett ärligt förbehåll:</b> krypteringen görs av appen, som hämtas från samma server. Den som kontrollerar servern skulle i teorin kunna byta ut appen mot en som läser lösenordet. Sisyfos är öppen källkod och läggs bara ut på servern från GitHub, där varje ändring syns; en installerad app minskar risken ytterligare.</li></ul>
  <h3>Vad som skickas över nätet</h3>
  <ul><li><b>Appen hämtas</b> från agrellarkitektur.se. Webbhotellet för, som alla webbservrar, tekniska loggar över anrop (IP-adress, tidpunkt, vilken fil). Inget ur boken följer med.</li>
  <li><b>Synpunkter</b> – bara när du trycker på Skicka: det du skrivit i formuläret, din e-postadress om du anger den och, om du kryssat i det, version och skärmstorlek. Skriptet skickar det vidare som e-post och sparar ingenting.</li>
  <li><b>Med konto på webben:</b> den krypterade boken när den ändras, e-postadressen och en inloggning som räknas fram ur lösenordet (servern sparar bara ett hashvärde av den). Webbhotellets loggar visar då också IP-adress och tidpunkt för synken.</li>
  <li><b>Inget annat.</b> Ingen statistik, spårning, reklam, AI eller tjänster från andra företag. Typsnitten är inbyggda.</li></ul>
  <h3>Ditt ansvar</h3>
  <ul><li>Du ansvarar för personuppgifterna du för in i boken, på samma sätt som för ett eget kalkylark eller pappersarkiv. Utan konto på webben når inget ur boken Agrell Arkitektur. Med konto sparar vi din e-postadress och den krypterade boken – som vi inte kan läsa – bara för att tjänsten ska fungera. Lagringen på webben är ett test utan garanti; ändras eller avvecklas den får du besked till e-postadressen, och boken finns kvar på dina enheter.</li>

   Svenska helgdagar räknas bort ur normtiden automatiskt. Administratören kan justera normtiden per dag
   för ett år, se årstimmarna summeras och spara årsarbetstiden. Kalendern lagras som avvikelser från

  const n = h + l - 7 * m + 114;

}

function saveCust() {
  const g = id => $('#' + id).value.trim(), name = g('cuName'), err = $('#cuErr');
  if (!name) { err.textContent = 'Ge kunden ett namn.'; $('#cuName').focus(); return; }
  const dup = R().customers.find(c => c.id !== st.editCust && c.name.toLowerCase() === name.toLowerCase());
  if (dup) { err.textContent = `Det finns redan en kund som heter ${dup.name}.`; return; }
  const email = g('cuEmail'); if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { err.textContent = 'E-postadressen ser inte rätt ut.'; return; }
  const data = { name, orgNr: g('cuOrg'), ref: g('cuRef'), contact: g('cuContact'), email, phone: g('cuPhone'), address: $('#cuAddr').value.trim(), invoiceAddress: $('#cuInvTog').checked ? $('#cuInv').value.trim() : '' };
  if ($('#cuVat')) {
    const vn = g('cuVat').replace(/\s/g, '').toUpperCase(), tm = g('cuTerms');
    if (vn && !/^[A-Z]{2}[0-9A-Z]{2,13}$/.test(vn)) { err.textContent = 'Momsregistreringsnumret ser inte rätt ut – landskod och nummer, till exempel SE556000000001 eller DE123456789.'; return; }
    if (tm && !(Math.floor(pNum(tm)) >= 0 && Math.floor(pNum(tm)) <= 365)) { err.textContent = 'Ange betalningsvillkoret som 0–365 dagar, eller lämna tomt.'; return; }
    const zn = $('#cuZone')?.value || 'se';
    if (zn === 'eu' && !vn) { err.textContent = 'Ett företag i ett annat EU-land behöver momsregistreringsnumret på fakturan (med landskod, t.ex. DE123456789).'; $('#cuVat').focus(); return; }
    if (zn === 'eu' && vn.startsWith('SE')) { err.textContent = 'Momsnumret börjar med SE – välj Sverige, eller ange kundens utländska momsnummer.'; $('#cuVat').focus(); return; }
    data.zone = zn;
    data.vatNo = vn; data.terms = tm ? Math.floor(pNum(tm)) : null; if (data.terms == null) delete data.terms;
  }
  const cr = {};
  for (const inp of $$('[data-cr]')) { const v = parseKr(inp.value); if (v != null && !(v >= 0)) { err.textContent = 'Timpriset ska vara ett tal i kronor.'; inp.focus(); return; } cr[inp.dataset.cr] = v; }
  let c = st.editCust && cust(st.editCust);
  const snap = rateSnap(), prevReg = JSON.stringify(R()), prevRates = c?.roleRates ? JSON.parse(JSON.stringify(c.roleRates)) : undefined, from = c ? rfVal('cuRF') : '';
  const rates = { ...(c?.roleRates || {}) }, keys = new Set(), dt = c && rfTouched('cuRF'); let rch = false;
  for (const k in cr) if (rCh($(`[data-cr="${k}"]`), rates[k], cr[k], from, dt)) { rSet(rates, k, cr[k], from); rch = true; if (c) keys.add(`c|${c.id}|${k}`); }
  if (Object.keys(rates).length) data.roleRates = rates; else if (c) delete c.roleRates;
  if (data.zone === 'se') delete data.zone;
  if (c) { Object.assign(c, data); if ($('#cuTerms') && data.terms == null) delete c.terms; if ($('#cuZone') && !data.zone) delete c.zone; } else { c = { id: 'k' + uid(), archived: false, notes: [], created: new Date().toISOString(), ...data }; R().customers.push(c); }
  const C = c, edit = st.editCust;
  const finish = ch => { closeDlg(); st.focus = C.id; renderMain();
    if (rch && edit) toast(`${C.name} är sparad${rChTxt(ch)}`, { label: 'Ångra priserna', fn: () => { repriceUndo(ch); if (prevRates) C.roleRates = prevRates; else delete C.roleRates; save(); renderMain(); } });
    else toast(`${C.name} är sparad`); };
  if (rch) priceGate({ snap, keys, from, prevReg, finish }); else { save(); finish([]); }
}

function pSorter(how) {
  return (a, b) => {
    const r = (pRank(a.p) - pRank(b.p)); if (r) return r;
    if (how === 'open') return (b.m.oa - a.m.oa) || (b.m.oh - a.m.oh) || String(b.p.number).localeCompare(String(a.p.number));

}

  if (!v.bg && !v.pg && !v.iban) return ['Ange bankgiro, plusgiro eller IBAN.', 'ioBg'];
  if (v.bg && !/^\d{3,4}-?\d{4}$/.test(v.bg)) return ['Bankgironumret ser inte rätt ut – till exempel 123-4567.', 'ioBg'];

// Kompsaldot vid periodens slut (i dag om perioden inte är slut). Dagsummorna kommer från agg().
function compAt(end) {
  if (!hasNorm()) return null;
  const A = agg(), p = person(), t = today(), stop = end < t ? end : t;
  let s = +p.balanceIn || 0;
  for (let d = p.balanceStart || t; d <= stop; d = addD(d, 1)) { const x = A.D.get(d); s += dayBal(d, x?.t || 0, x?.k.comp || 0); }
  return s;
}
function personPeriod() { const r = rep(); return r.ptype === 'week' ? [r.pwk, addD(r.pwk, 6)] : [`${r.pym}-01`, ymLast(r.pym)]; }
function personData(from, to) {
  const p = person(), es = live().filter(e => e.date >= from && e.date <= to && e.hours > 0), lines = new Map(), absT = new Map();
  let bill = 0, intern = 0, abs = 0;
  for (const e of es) {
    const P = proj(e.projectId), T = taskOf(P, e.taskId), ak = absKind(e);
    if (ak) { abs += e.hours; const o = absT.get(ak) || { name: T?.name || ak, hours: 0, days: 0 }; o.hours += e.hours; o.days += e.hours / fullDay(e.date); absT.set(ak, o); continue; }
    const b = billable(e); if (b) bill += e.hours; else intern += e.hours;
    const k = e.projectId + '~' + e.taskId, o = lines.get(k) || { P, T, hours: 0, amount: 0, bill: b }; o.hours += e.hours; o.amount += amountOf(e); lines.set(k, o);
  }
  const days = [], t = today(); let nrm = 0, bal = 0;
  for (let d = from; d <= to; d = addD(d, 1)) {
    const tot = dayTotal(d), a = dayAbs(d), n = norm(d), b = hasNorm() ? dayBal(d) : 0; nrm += n; bal += b;
    const note = dayNote(d);
    if (tot > 0 || n > 0 || note) days.push({ d, tot, abs: a, norm: n, bal: b, future: d > t, red: holidays(+d.slice(0, 4))[d]?.name, note });
  }
  const sorted = [...lines.values()].sort((a, b) => (b.bill - a.bill) || (pRank(a.P) - pRank(b.P)) || String(a.P.number).localeCompare(String(b.P.number)));
  return { p, from, to, bill, intern, abs, tot: bill + intern + abs, norm: nrm, bal, comp: compAt(to), lines: sorted, absT: [...absT.values()], days, vac: vacInfo(), hn: hasNorm() };
}
