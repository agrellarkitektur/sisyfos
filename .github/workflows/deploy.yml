# Publicerar appen på webbhotellet via FTPS vid varje push till main (och för hand).
# Aktiveras först när hemligheterna finns: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
# och frivilligt FTP_DIR (standard /sisyfos/) och FTP_PROTOCOL (standard ftps).
name: Publicera på webbhotellet
on:
  push:
    branches: [main]
    paths: ['index.html', 'feedback.php', 'sw.js', 'manifest.webmanifest', '*.png', 'icon.svg']
  workflow_dispatch:
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAR_FTP: ${{ secrets.FTP_SERVER != '' && secrets.FTP_USERNAME != '' && secrets.FTP_PASSWORD != '' }}
    steps:
      - name: Hoppa över utan hemligheter
        if: env.HAR_FTP != 'true'
        run: echo "::notice::FTP-hemligheterna saknas – inget publiceras."
      - uses: actions/checkout@v4
        if: env.HAR_FTP == 'true'
      - name: Samla filerna
        if: env.HAR_FTP == 'true'
        run: |
          mkdir -p publicera
          cp index.html feedback.php sw.js manifest.webmanifest icon.svg favicon-32.png icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png publicera/
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        if: env.HAR_FTP == 'true'
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
          server-dir: ${{ secrets.FTP_DIR || '/sisyfos/' }}
          local-dir: ./publicera/
          dangerous-clean-slate: false
      - name: Kontrollera att webbhotellet har den nya versionen
        if: env.HAR_FTP == 'true'
        run: |
          WANT=$(grep -oP "const VERSION = '\K[^']+" sw.js)
          URL="${{ vars.SITE_URL || 'https://agrellarkitektur.se/sisyfos/' }}"
          sleep 5
          GOT=$(curl -fsS -H 'Cache-Control: no-cache' "${URL}sw.js?t=$(date +%s)" | grep -oP "const VERSION = '\K[^']+" || echo "hittades inte")
          STATE=$(curl -s -o /dev/null -w '%{http_code}' "${URL}.ftp-deploy-sync-state.json")
          echo "Väntad version: $WANT · på ${URL}: $GOT · sync-state: HTTP $STATE"
          if [ "$GOT" != "$WANT" ]; then
            echo "::error::Webbhotellet visar version $GOT, väntad $WANT. sync-state på webbadressen: HTTP $STATE (404 = filerna laddas upp till en annan mapp än den som visas på ${URL} – kontrollera FTP_DIR)."
            exit 1
          fi
          echo "::notice::Webbhotellet har version $GOT."
