# Publicerar appen på webbhotellet via FTPS vid varje push till main (och för hand).
# Aktiveras först när hemligheterna finns: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
# och frivilligt FTP_DIR (standard /sisyfos/) och FTP_PROTOCOL (standard ftps).
# SISYFOS_ADMIN_KEY (frivillig) blir adminnyckeln för api.php – bara dess sha256 hamnar på servern.
name: Publicera på webbhotellet
on:
  push:
    branches: [main]
    paths: ['index.html', 'feedback.php', 'api.php', 'sw.js', 'manifest.webmanifest', '*.png', 'icon.svg']
  workflow_dispatch:
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAR_FTP: ${{ secrets.FTP_SERVER != '' && secrets.FTP_USERNAME != '' && secrets.FTP_PASSWORD != '' }}
    steps:
      - name: Hoppa över utan hemligheter
        if: env.HAR_FTP != 'true'
        run: echo "::notice::FTP-hemligheterna saknas – inget publiceras."
      - uses: actions/checkout@v7
        if: env.HAR_FTP == 'true'
      - name: Samla filerna
        if: env.HAR_FTP == 'true'
        run: |
          mkdir -p publicera
          cp index.html feedback.php api.php sw.js manifest.webmanifest icon.svg favicon-32.png icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png publicera/
      - name: Adminnyckel för api.php
        if: env.HAR_FTP == 'true'
        env:
          KEY: ${{ secrets.SISYFOS_ADMIN_KEY }}
        run: |
          KEY=$(printf '%s' "$KEY" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          if [ -n "$KEY" ]; then H=$(printf '%s' "$KEY" | sha256sum | cut -d' ' -f1); else H=''; echo "::notice::SISYFOS_ADMIN_KEY saknas – inga inbjudningskoder kan skapas."; fi
          printf "<?php\n// Skrivs av publiceringen på GitHub. sha256 av adminnyckeln (hemligheten SISYFOS_ADMIN_KEY).\nreturn ['admin' => '%s'];\n" "$H" > publicera/api-config.php
      - uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        if: env.HAR_FTP == 'true'
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
          server-dir: ${{ secrets.FTP_DIR || '/sisyfos/' }}
          local-dir: ./publicera/
          dangerous-clean-slate: false
      - name: Kontrollera att webbhotellet har den nya versionen
        if: env.HAR_FTP == 'true'
        run: |
          WANT=$(grep -oP "const VERSION = '\K[^']+" sw.js)
          URL="${{ vars.SITE_URL || 'https://agrellarkitektur.se/sisyfos/' }}"
          sleep 5
          GOT=$(curl -fsS -H 'Cache-Control: no-cache' "${URL}sw.js?t=$(date +%s)" | grep -oP "const VERSION = '\K[^']+" || echo "hittades inte")
          STATE=$(curl -s -o /dev/null -w '%{http_code}' "${URL}.ftp-deploy-sync-state.json")
          echo "Väntad version: $WANT · på ${URL}: $GOT · sync-state: HTTP $STATE"
          if [ "$GOT" != "$WANT" ]; then
            echo "::error::Webbhotellet visar version $GOT, väntad $WANT. sync-state på webbadressen: HTTP $STATE (404 = filerna laddas upp till en annan mapp än den som visas på ${URL} – kontrollera FTP_DIR)."
            exit 1
          fi
          echo "::notice::Webbhotellet har version $GOT."
          # Bara information: skickar webbhotellet appen komprimerad? (index.html är ~700 kB, ~250 kB med gzip)
          ENC=$(curl -sS -o /dev/null -D - -H 'Accept-Encoding: gzip, br' "${URL}index.html?t=$(date +%s)" | tr -d '\r' | grep -i '^content-encoding:' | cut -d' ' -f2 || true)
          SIZE=$(curl -sS -o /dev/null -w '%{size_download}' -H 'Accept-Encoding: gzip, br' "${URL}index.html?t=$(date +%s)" || echo '?')
          echo "::notice::index.html skickas ${ENC:-utan komprimering} – ${SIZE} byte över nätet."
      - name: Kontrollera servern för lagring på webben
        if: env.HAR_FTP == 'true'
        run: |
          URL="${{ vars.SITE_URL || 'https://agrellarkitektur.se/sisyfos/' }}"
          ST=$(curl -sS "${URL}api.php?a=status" || true)
          echo "api.php: $ST"
          echo "$ST" | grep -q '"ok":true' || { echo "::error::api.php svarar inte som väntat: $ST"; exit 1; }
          LAGE=$(echo "$ST" | grep -oP '"storage":"\K[a-z]+')
          ADMIN=$(echo "$ST" | grep -oP '"admin":\K(true|false)')
          if [ "$LAGE" = "inside" ]; then
            for F in data/.htaccess data/secret.key data/invites.json; do
              C=$(curl -s -o /dev/null -w '%{http_code}' "${URL}${F}")
              echo "${F}: HTTP $C"
              if [ "$C" = "200" ]; then echo "::error::${URL}${F} går att läsa på webben – datamappen är inte spärrad!"; exit 1; fi
            done
            echo "::notice::Datamappen ligger i sisyfos/data/ och är spärrad för webben."
          else
            echo "::notice::Datamappen ligger utanför webbroten."
          fi
          echo "::notice::Adminnyckel satt: $ADMIN"
