# Lägger en färdig zip för webbhotellet på en release.
# Skapa releasen på GitHub (Releases → Draft a new release → tagg v0.13.2 …) – zippen läggs till av sig själv.
# Taggen måste ligga på en commit där APP_VERSION i index.html är samma version. GitHub föreslår main som
# Target – har main hunnit få en nyare version, välj den rätta commiten under Target → Recent commits.
# Kan också köras för hand för en befintlig tagg, med en annan commit (ref) om taggen ligger fel.
name: Release-zip
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tagg att bygga zip för, t.ex. v0.13.2'
        required: true
      ref:
        description: 'Frivilligt: commit att bygga från om taggen ligger på fel commit'
        required: false
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      REF: ${{ inputs.ref || github.event.release.tag_name || inputs.tag }}
    steps:
      # Hela historiken, så att taggar och förkortade commit-id (t.ex. dcdbb20) går att välja i nästa steg
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Välj taggen eller commiten
        run: git checkout -q --detach "$REF" && git log -1 --format='%h %s' | cut -c1-100
      - name: Kontrollera versionen
        run: |
          APP=$(grep -oP "APP_VERSION = '\K[^']+" index.html)
          V=${TAG#v}
          HERE=$(git rev-parse --short HEAD)
          echo "APP_VERSION=$APP, tagg=$V, commit $HERE"
          if [ "$APP" != "$V" ]; then
            RATT=$(git log --all --reverse --format='%h (%s)' -S"APP_VERSION = '$V'" -- index.html | head -1 | cut -c1-90)
            if [ -n "$RATT" ]; then
              echo "::error::Taggen $TAG ligger på commit $HERE, där index.html har version $APP. Version $V finns i commit $RATT. Ta bort releasen och taggen $TAG i GitHub och skapa releasen igen med Target = den commiten (Recent commits), eller kör Release-zip för hand med tag $TAG och ref = den commiten – eller skapa releasen v$APP i stället."
            else
              echo "::error::Taggen $TAG stämmer inte med APP_VERSION $APP i index.html, och ingen commit har version $V."
            fi
            exit 1
          fi
          if [ -f sw.js ]; then SW=$(grep -oP "const VERSION = '\K[^']+" sw.js); [ "$SW" = "$V" ] || echo "::warning::sw.js har VERSION $SW – uppdatera den så att cachen byts"; fi
      - name: Bygg zip
        run: |
          mkdir -p sisyfos
          for f in index.html feedback.php api.php sw.js manifest.webmanifest icon.svg favicon-32.png icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png README.md CHANGELOG.md LICENSE; do [ -f "$f" ] && cp "$f" sisyfos/; done
          zip -r "sisyfos-$TAG.zip" sisyfos
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          files: sisyfos-${{ env.TAG }}.zip
