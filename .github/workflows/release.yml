# Lägger en färdig zip för webbhotellet på en release.
# Skapa releasen på GitHub (Releases → Draft a new release → tagg v0.7.0 …) – zippen läggs till av sig själv.
# Taggen måste stämma med APP_VERSION i index.html. Kan också köras för hand för en befintlig tagg.
name: Release-zip
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tagg att bygga zip för, t.ex. v0.7.0'
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Kontrollera versionen
        run: |
          APP=$(grep -oP "APP_VERSION = '\K[^']+" index.html)
          V=${TAG#v}
          echo "APP_VERSION=$APP, tagg=$V"
          if [ "$APP" != "$V" ]; then echo "::error::Taggen $TAG stämmer inte med APP_VERSION $APP i index.html"; exit 1; fi
          if [ -f sw.js ]; then SW=$(grep -oP "const VERSION = '\K[^']+" sw.js); [ "$SW" = "$V" ] || echo "::warning::sw.js har VERSION $SW – uppdatera den så att cachen byts"; fi
      - name: Bygg zip
        run: |
          mkdir -p sisyfos
          for f in index.html feedback.php sw.js manifest.webmanifest icon.svg favicon-32.png icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png README.md CHANGELOG.md LICENSE; do [ -f "$f" ] && cp "$f" sisyfos/; done
          zip -r "sisyfos-$TAG.zip" sisyfos
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: sisyfos-${{ env.TAG }}.zip
