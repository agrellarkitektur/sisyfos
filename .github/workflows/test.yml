# Kontrollerar att alla gamla böcker i test/bocker går att öppna i den nya versionen,
# att fakturorna fungerar (0.15.0) och att servern för lagring på webben (api.php) fungerar.
name: Test – gamla böcker öppnas
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04  # fast version – Playwright känner till systempaketen här
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Öppna varje bok
        run: |
          python -m http.server 8765 >/dev/null 2>&1 &
          sleep 1
          python test/oppna_gamla_bocker.py
      - name: Boken i delar och nycklarna
        run: |
          python -m http.server 8765 >/dev/null 2>&1 &
          sleep 1
          python test/delar_test.py
      - name: Timpriser och signering
        run: |
          python -m http.server 8765 >/dev/null 2>&1 &
          sleep 1
          python test/priser_test.py
      - name: Månadsvyn, Enter och startrutan
        run: |
          python -m http.server 8765 >/dev/null 2>&1 &
          sleep 1
          python test/manad_test.py
      - name: Arbetet med flera
        run: |
          python -m http.server 8765 >/dev/null 2>&1 &
          sleep 1
          python test/flera_test.py
      - name: Fakturor
        run: |
          sudo apt-get install -y poppler-utils >/dev/null
          python -m http.server 8765 >/dev/null 2>&1 &
          sleep 1
          python test/faktura_test.py
          python test/faktura2_test.py
      - name: Enklare flöde för den ensamme och veckor i rapporterna
        run: |
          python -m http.server 8765 >/dev/null 2>&1 &
          sleep 1
          python test/enkel_test.py
      - name: Servern för lagring på webben
        run: |
          php -v | head -1
          python test/api_test.py
      - name: En organisation – admin och medarbetare
        run: python test/org_test.py
